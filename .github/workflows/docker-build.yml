name: Test, Build and Push Docker Image

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - main

env:
  REGISTRY_URL: "ccr.ccs.tencentyun.com"
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: admin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.26.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run stable API unit tests
        run: >-
          pnpm exec vitest run
          tests/unit/api/client-api.test.ts
          tests/unit/api/oauth-authorization-api.test.ts
          tests/unit/api/notification-api.test.ts
          tests/unit/api/captcha-scene-api.test.ts

      - name: Build production assets
        run: pnpm build

      - name: Upload production assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: admin-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  build-and-push:
    name: Build and Push Docker Image
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.DOCKER_CLOUD_SECRET_ID }}
          password: ${{ secrets.DOCKER_CLOUD_SECRET_KEY }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push production image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GW_HOST=10.0.10.4
          cache-from: type=gha
          cache-to: type=gha,mode=max
